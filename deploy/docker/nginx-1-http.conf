# ETAPA 1 (antes del certificado): solo HTTP, para que certbot valide el dominio.
# Reemplace DOMINIO (Ej.: rutatours.venustechfp.com) y copie a la carpeta conf.d del contenedor nginx.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://rutatours-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
