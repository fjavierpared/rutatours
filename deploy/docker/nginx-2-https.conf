# ETAPA 2 (con el certificado emitido): HTTP redirige a HTTPS.
# Reemplace DOMINIO y sustituya con este archivo el de la etapa 1.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Imágenes y comprobantes llegan como base64 dentro del JSON (hasta 5 MB)
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Si el contenedor se reinicia, nginx vuelve a resolver su IP en lugar de fallar al arrancar
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rutatours http://rutatours-web:3000;

    location / {
        proxy_pass $rutatours;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;   # la lectura de la tasa BCV puede tardar
    }
}
