# Nginx como proxy de RutaTours. Reemplace DOMINIO por el dominio real (Ej.: rutatours.venutech.com).
# Instalación:
#   sudo cp deploy/nginx-rutatours.conf /etc/nginx/sites-available/rutatours
#   sudo sed -i 's/DOMINIO/rutatours.venutech.com/g' /etc/nginx/sites-available/rutatours
#   sudo ln -s /etc/nginx/sites-available/rutatours /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMINIO        (HTTPS gratis con Let's Encrypt; agrega la redirección de http a https)

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # Las imágenes de rutas y comprobantes llegan como base64 dentro del JSON (hasta 5 MB)
    client_max_body_size 6m;

    # Fotos subidas: las sirve Nginx directamente, con caché
    location /uploads/ {
        alias /opt/rutatours/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # la lectura de la tasa BCV puede tardar
    }
}
