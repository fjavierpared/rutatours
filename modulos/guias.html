<div class="modulo-contenido layout-split">
    <aside class="split-form-col">
        <section class="card card-formulario">
            <div class="card-header">
                <h3 id="guia-form-titulo"><svg class="icon"><use href="img/icons.svg#i-user-round"></use></svg><span>Nuevo guía</span></h3>
                <p class="ayuda">El costo por día es referencial: al editar una ruta puede agregarlo a sus costos con un clic.</p>
            </div>
            <form id="guia-form" class="form-vertical" autocomplete="off">
                <input type="hidden" id="guia-id">
                <div class="form-group">
                    <label for="guia-nombre">Nombre completo</label>
                    <input type="text" id="guia-nombre" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="guia-documento">Documento</label>
                    <input type="text" id="guia-documento" maxlength="20" required placeholder="Ej.: V-12345678">
                </div>
                <div class="form-group">
                    <label for="guia-telefono">Teléfono</label>
                    <input type="tel" id="guia-telefono" maxlength="30">
                </div>
                <div class="form-group">
                    <label for="guia-email">Correo</label>
                    <input type="email" id="guia-email" maxlength="120">
                </div>
                <div class="form-group">
                    <label for="guia-idiomas">Idiomas</label>
                    <input type="text" id="guia-idiomas" maxlength="150" placeholder="Ej.: Español, Inglés">
                </div>
                <div class="form-group">
                    <label for="guia-licencia">Licencia / acreditación</label>
                    <input type="text" id="guia-licencia" maxlength="60">
                </div>
                <div class="form-group">
                    <label for="guia-costo_dia_usd">Costo por día (USD)</label>
                    <input type="number" id="guia-costo_dia_usd" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="guia-activo">Estado</label>
                    <select id="guia-activo">
                        <option value="1">Activo</option>
                        <option value="0">Inactivo (de baja)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="guia-disponible">Disponibilidad</label>
                    <select id="guia-disponible">
                        <option value="1">Disponible para reservas</option>
                        <option value="0">No disponible (vacaciones, reposo...)</option>
                    </select>
                </div>
                <div class="form-acciones">
                    <button type="submit" class="btn btn-success" id="guia-submit"></button>
                    <button type="button" class="btn btn-secundario oculto" id="guia-cancelar"><svg class="icon"><use href="img/icons.svg#i-x"></use></svg>Cancelar edición</button>
                </div>
            </form>
        </section>
    </aside>

    <main class="split-tabla-col">
        <section class="card card-tabla">
            <div class="tabla-toolbar">
                <div class="buscador">
                    <svg class="icon"><use href="img/icons.svg#i-search"></use></svg>
                    <input type="text" id="guia-filtro" placeholder="Buscar por nombre, documento o idioma...">
                </div>
                <div class="contador-pill" id="guia-contador">Cargando...</div>
            </div>
            <div class="tabla-contenedor">
                <table class="tabla-lista" id="guia-tabla">
                    <thead>
                        <tr>
                            <th class="col-num">N°</th>
                            <th>Guía</th>
                            <th>Contacto</th>
                            <th>Idiomas</th>
                            <th class="num">Costo/día</th>
                            <th class="num">Rutas</th>
                            <th>Estado</th>
                            <th class="col-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
