<div class="modulo-contenido layout-split">
    <aside class="split-form-col">
        <section class="card card-formulario">
            <div class="card-header">
                <h3 id="vehiculo-form-titulo"><svg class="icon"><use href="img/icons.svg#i-bus"></use></svg><span>Nuevo vehículo</span></h3>
                <p class="ayuda">La capacidad limita el máximo de personas de las rutas que lo usan.</p>
            </div>
            <form id="vehiculo-form" class="form-vertical" autocomplete="off">
                <input type="hidden" id="vehiculo-id">
                <div class="form-group">
                    <label for="vehiculo-placa">Placa</label>
                    <input type="text" id="vehiculo-placa" maxlength="15" required>
                </div>
                <div class="form-group">
                    <label for="vehiculo-tipo">Tipo</label>
                    <input type="text" id="vehiculo-tipo" maxlength="40" required placeholder="Ej.: Van, Autobús, 4x4" list="vehiculo-tipos">
                    <datalist id="vehiculo-tipos"><option value="Van"><option value="Autobús"><option value="Buseta"><option value="4x4"><option value="Camioneta"></datalist>
                </div>
                <div class="form-group">
                    <label for="vehiculo-marca">Marca</label>
                    <input type="text" id="vehiculo-marca" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="vehiculo-modelo">Modelo</label>
                    <input type="text" id="vehiculo-modelo" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="vehiculo-capacidad">Capacidad (pasajeros)</label>
                    <input type="number" id="vehiculo-capacidad" min="1" max="500" step="1" required>
                </div>
                <div class="form-group">
                    <label for="vehiculo-costo_transporte_dia_usd">Transporte por día (USD)</label>
                    <input type="number" id="vehiculo-costo_transporte_dia_usd" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="vehiculo-costo_combustible_dia_usd">Combustible por día (USD)</label>
                    <input type="number" id="vehiculo-costo_combustible_dia_usd" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="vehiculo-activo">Estado</label>
                    <select id="vehiculo-activo">
                        <option value="1">Activo</option>
                        <option value="0">Inactivo (de baja)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="vehiculo-disponible">Disponibilidad</label>
                    <select id="vehiculo-disponible">
                        <option value="1">Disponible para reservas</option>
                        <option value="0">No disponible (taller, mantenimiento...)</option>
                    </select>
                </div>
                <div class="form-acciones">
                    <button type="submit" class="btn btn-success" id="vehiculo-submit"></button>
                    <button type="button" class="btn btn-secundario oculto" id="vehiculo-cancelar"><svg class="icon"><use href="img/icons.svg#i-x"></use></svg>Cancelar edición</button>
                </div>
            </form>
        </section>
    </aside>

    <main class="split-tabla-col">
        <section class="card card-tabla">
            <div class="tabla-toolbar">
                <div class="buscador">
                    <svg class="icon"><use href="img/icons.svg#i-search"></use></svg>
                    <input type="text" id="vehiculo-filtro" placeholder="Buscar por placa, tipo o marca...">
                </div>
                <div class="contador-pill" id="vehiculo-contador">Cargando...</div>
            </div>
            <div class="tabla-contenedor">
                <table class="tabla-lista" id="vehiculo-tabla">
                    <thead>
                        <tr>
                            <th class="col-num">N°</th>
                            <th>Vehículo</th>
                            <th class="num">Capacidad</th>
                            <th class="num">Transporte/día</th>
                            <th class="num">Combustible/día</th>
                            <th class="num">Rutas</th>
                            <th>Estado</th>
                            <th class="col-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
